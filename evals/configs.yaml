# Configurations the eval harness compares. Each one is config/swarm.yaml plus the overrides below.
# mode: swarm = full team (plan -> workers -> verifier -> synthesis)
#       solo  = the coordinator alone reads the same evidence and answers (no team, no verifier)
# Every configuration gets the SAME sub-questions and the SAME fetched sources for a question,
# so differences in the score come from the models, not from luck in web search.

configs:
  swarm-mixed:
    description: Mixed team from different labs (the current default swarm)
    overrides: {}

  coordinator-only:
    description: Qwen3.5-4B alone reads the evidence and answers
    overrides:
      mode: solo

  single-large:
    description: One bigger model (Qwen3.5-9B) alone reads the evidence and answers
    overrides:
      mode: solo
      coordinator: {model: Qwen3.5-9B, ctx_per_slot: 16384, parallel: 1}

  same-model-x3:
    description: Three copies of one small model (Phi-4-mini) instead of three labs
    overrides:
      workers:
        team: [Phi-4-mini-instruct, Phi-4-mini-instruct, Phi-4-mini-instruct]
        temperature: 0.7   # some variety between the copies

  # ---- team-size study: 1 to 5 workers from different labs (+ verifier + coordinator) ----
  # Workers are taken in order from workers.pool in config/swarm.yaml, one per lineage:
  # Ministral (Mistral), LFM2.5 (Liquid), Phi-4-mini (Microsoft), Gemma-4-E2B (Google), SmolLM3 (Hugging Face)
  swarm-t1:
    description: 1 worker (Ministral) + verifier + coordinator
    overrides: {workers: {team_size: 1}}
  swarm-t2:
    description: 2 workers + verifier + coordinator
    overrides: {workers: {team_size: 2}}
  swarm-t3:
    description: 3 workers + verifier + coordinator (same as swarm-mixed)
    overrides: {workers: {team_size: 3}}
  swarm-t4:
    description: 4 workers + verifier + coordinator
    overrides: {workers: {team_size: 4}}
  swarm-t5:
    description: 5 workers + verifier + coordinator (more than fits on the GPU at once)
    overrides: {workers: {team_size: 5}}

  # ---- roles study: different jobs instead of clones (no extra VRAM: reuses the same 3 small models) ----
  swarm-roles:
    description: 2 answerers + fact sheet + premise check + skeptic (reviews verified claims)
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- reranker study: same setups, passages chosen by Qwen3-Reranker instead of keyword ranking ----
  rerank4b-coordinator-only:
    description: "coordinator-only, passages chosen by Qwen3-Reranker-4B"
    overrides: {research: {reranker: Qwen3-Reranker-4B}}
  rerank06-coordinator-only:
    description: "coordinator-only, passages chosen by Qwen3-Reranker-0.6B"
    overrides: {research: {reranker: Qwen3-Reranker-0.6B}}
  rerank4b-roles-2ways-split:
    description: "roles-2ways-split, passages chosen by Qwen3-Reranker-4B"
    overrides:
      research: {split_by_subquestion: true, reranker: Qwen3-Reranker-4B}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- team diversity: where does a team's variety help - different models or different ways of thinking? ----
  # (strategies come from MCP/reasoning-mcp; see swarm/strategies.py)
  team-clones:
    description: "Ministral x3, all answering directly (the clone baseline, temperature 0.7)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct], temperature: 0.7}}
  team-1model-3ways:
    description: "Ministral x3, each thinking a different way (self-ask, step back, tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct],
                          strategies: [self_ask, step_back, tree_of_thoughts]}}
  team-3models-3ways:
    description: "Ministral, LFM, Phi, each thinking a different way (self-ask, step back, tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, LFM2.5-2.6B, Phi-4-mini-instruct],
                          strategies: [self_ask, step_back, tree_of_thoughts]}}
  team-2models-2ways:
    description: "Ministral (self-ask) + LFM (tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, LFM2.5-2.6B], strategies: [self_ask, tree_of_thoughts]}}
  roles-no-premise:
    description: "2 answerers + fact sheet + skeptic (no premise check)"
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}
  roles-2ways:
    description: "swarm-roles, with the two answerers thinking differently (self-ask, tree of thoughts)"
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # A big coordinator that takes turns with the team: the team runs with the whole card, then the
  # team is unloaded and the big model writes the answer (the "time-shared coordinator" idea).
  bigcoord-gptoss:
    description: "fact sheet + skeptic team, gpt-oss-20b writes the final answer (takes turns on the GPU)"
    overrides:
      research: {split_by_subquestion: true}
      coordinator: {model: gpt-oss-20b, ctx_per_slot: 12288, parallel: 1}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}
  bigcoord-qwen36:
    description: "fact sheet + skeptic team, Qwen3.6-35B-A3B (GPU + RAM) writes the final answer"
    overrides:
      research: {split_by_subquestion: true}
      coordinator: {model: Qwen3.6-35B-A3B, ctx_per_slot: 12288, parallel: 1}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- equal-compute baselines: ONE model spends a swarm-sized token budget (several drafts, then merges them)
  solo-x4-Qwen3.5-4B:
    description: "Qwen3.5-4B alone, 4 drafts merged into one answer (same model, more compute)"
    overrides: {mode: solo, solo_samples: 4}
  solo-x8-Qwen3.5-4B:
    description: "Qwen3.5-4B alone, 8 drafts merged into one answer"
    overrides: {mode: solo, solo_samples: 8}

  # ---- swarm-style research: each part of the question is searched separately (only matters in --live runs)
  clones-split:
    description: "Ministral x3 (clones), and each part of the question gets its own web research"
    overrides:
      research: {split_by_subquestion: true}
      workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct], temperature: 0.7}
  roles-2ways-split:
    description: "roles-2ways (answerers thinking 2 ways + fact sheet + premise + skeptic) with per-part web research"
    overrides:
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- MID-SIZE SWARM v2 (2026-10-03): built from the coordinator bake-off (MiMo), worker rounds
  # 1-3 (best model + way of thinking, four different families) and the verifier bench (Gemma-4-E4B,
  # already loaded as a worker). Answers may be up to 2000 tokens (Apertus ran out at 1425).
  # Frozen as external-v2 before any results; compared with MiMo alone and the bake-off winner.
  v2-swarm:
    description: "v2: MiMo-9B coordinator; answerers MiMo (step back), Apertus-8B (self-ask), EXAONE-1.2B, Gemma-4-E4B; Gemma verifier; per-part research"
    overrides:
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true}
      verifier: {model: Gemma-4-E4B-it}
      workers:
        answer_tokens: 2000
        roles:
          - {role: answerer, model: MiMo-V2.6-Distill-Qwen-9B, strategy: step_back}
          - {role: answerer, model: Apertus-v1.5-8B, strategy: self_ask}
          - {role: answerer, model: EXAONE-4.0-1.2B}
          - {role: answerer, model: Gemma-4-E4B-it}
  v2-swarm-rerank4b:
    description: "v2 swarm, passages chosen by Qwen3-Reranker-4B"
    overrides:
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true, reranker: Qwen3-Reranker-4B}
      verifier: {model: Gemma-4-E4B-it}
      workers:
        answer_tokens: 2000
        roles:
          - {role: answerer, model: MiMo-V2.6-Distill-Qwen-9B, strategy: step_back}
          - {role: answerer, model: Apertus-v1.5-8B, strategy: self_ask}
          - {role: answerer, model: EXAONE-4.0-1.2B}
          - {role: answerer, model: Gemma-4-E4B-it}

  # ---- NOTEBOOK STUDY (2026-10-03, development run on saved evidence; not frozen yet) ----
  # The workers share a notebook (swarm/notebook.py): independent reading with running notes, a merged
  # and fact-checked notebook, one review round, and the answer written from the notebook.
  # Two questions: (1) does the gain come from diverse models collaborating? (2) does that team need a
  # big leader, a tiny one, or none? GPU memory is about equal: the big coordinator's ~7 GB goes to
  # the 4th member (none) or to a 0.8B leader plus a 4th member (tiny).
  nb-big:
    description: "notebook; MiMo-9B leads (plans + writes); Apertus-8B, EXAONE-1.2B, Gemma-4-E4B take notes"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
  nb-none:
    description: "notebook; no leader: MiMo-9B joins as a 4th member; the best note-taker writes, the rest review"
    overrides:
      mode: notebook
      notebook: {leader: none, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [MiMo-V2.6-Distill-Qwen-9B, Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
  nb-tiny:
    description: "notebook; tiny leader Qwen3.5-0.8B; its memory buys a 4th member (Falcon-H1R-7B)"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      coordinator: {model: Qwen3.5-0.8B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it, Falcon-H1R-7B]}
  nb-same3:
    description: "notebook without diversity: 3 copies of Apertus-8B take notes; MiMo-9B leads"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, Apertus-v1.5-8B, Apertus-v1.5-8B]}
  diverse-separate:
    description: "diversity without collaboration: MiMo-9B leads; Apertus-8B, EXAONE-1.2B, Gemma-4-E4B answer separately (v2-style, bigger context)"
    overrides:
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it], ctx_per_slot: 8192, answer_tokens: 2000}

  # Notebook v2 (2026-10-03): looser merging of the same fact, junk-note filter, verifier retry,
  # writer sees no note ids. Same team in every config; ONLY the leader (who writes the answer) changes.
  # CPU leaders run in system RAM (gpu.cpu_models) so they never take VRAM or force a swap.
  nb2-big:
    description: "notebook v2; MiMo-9B leads on the GPU; Apertus-8B, EXAONE-1.2B, Gemma-4-E4B take notes"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
  nb2-cpu-lfm:
    description: "notebook v2; LFM2.5-1.2B leads on the CPU (whole GPU for the note-takers)"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
      coordinator: {model: LFM2.5-1.2B-Instruct, ctx_per_slot: 8192, parallel: 1}
      gpu: {cpu_models: [LFM2.5-1.2B-Instruct]}
  nb2-cpu-qwen2b:
    description: "notebook v2; Qwen3.5-2B leads on the CPU (whole GPU for the note-takers)"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
      coordinator: {model: Qwen3.5-2B, ctx_per_slot: 8192, parallel: 1}
      gpu: {cpu_models: [Qwen3.5-2B]}
  nb2-cpu-qwen4b:
    description: "notebook v2; Qwen3.5-4B leads on the CPU (whole GPU for the note-takers)"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, reads_per_passage: 2, chunk_passages: 4, rounds: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
      coordinator: {model: Qwen3.5-4B, ctx_per_slot: 8192, parallel: 1}
      gpu: {cpu_models: [Qwen3.5-4B]}

  # Notebook v3 (2026-10-04): wide reading. The team reads 15 passages per part (2.5x what a solo
  # model gets); the MiMo writer reads exactly the solo model's 6 per part PLUS the notebook, so the
  # notebook can only add. Compare with MiMo alone on 6 (solo) and on the same 15 (solo-wide).
  solo-MiMo-wide:
    description: "MiMo-9B alone reads the same wide evidence the team reads (15 passages per part)"
    overrides:
      mode: solo
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 24576, parallel: 1}
  nb3-wide:
    description: "notebook v3: Apertus-8B, EXAONE-1.2B, Gemma-4-E4B read 15/part and take notes; MiMo writes from its own 6/part + the notebook"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, writer: "evidence+notes", writer_passages_per_subquestion: 6,
                 reads_per_passage: 2, chunk_passages: 4, rounds: 1, ctx_per_slot: 6144}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it]}
  nb3-wide-same3:
    description: "notebook v3 without diversity: 3 copies of Apertus-8B read 15/part; MiMo writes from its own 6/part + the notebook"
    overrides:
      mode: notebook
      notebook: {leader: coordinator, writer: "evidence+notes", writer_passages_per_subquestion: 6,
                 reads_per_passage: 2, chunk_passages: 4, rounds: 1, ctx_per_slot: 6144}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, Apertus-v1.5-8B, Apertus-v1.5-8B]}
  diverse-separate-wide:
    description: "diversity without collaboration: the same 3 models each answer from the wide evidence; MiMo merges"
    overrides:
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Gemma-4-E4B-it}
      workers: {team: [Apertus-v1.5-8B, EXAONE-4.0-1.2B, Gemma-4-E4B-it], ctx_per_slot: 8192, answer_tokens: 2000}

  # Manager mode (2026-10-04, Chris's design): MiMo acts like a person directing assistants. It starts
  # with the same wide evidence as solo-MiMo-wide, then turn by turn gives ONE teammate one task (with an
  # optional web search), can hand the same task to the other teammate, and stops when satisfied.
  mgr-alone:
    description: "manager loop, no team: MiMo-9B searches and reads every step itself (up to 6 turns)"
    overrides:
      mode: manager
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [MiMo-V2.6-Distill-Qwen-9B], ctx_per_slot: 8192}
  mgr-same2:
    description: "manager loop: MiMo-9B directs two copies of Qwen3.5-4B (no diversity)"
    overrides:
      mode: manager
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-4B], ctx_per_slot: 8192}
  mgr-duo:
    description: "manager loop: MiMo-9B directs Qwen3.5-4B and Gemma-4-E4B (two different teammates)"
    overrides:
      mode: manager
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}

  # Manager "both" (2026-10-04): every task goes to BOTH teammates at once; MiMo sees two independent
  # answers and whether they agree. The real diversity test: different pair vs identical pair.
  mgr-both-same:
    description: "manager loop, every task to both: MiMo-9B + two copies of Qwen3.5-4B (no diversity)"
    overrides:
      mode: manager
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-4B], ctx_per_slot: 8192}
  mgr-both-duo:
    description: "manager loop, every task to both: MiMo-9B + Qwen3.5-4B and Gemma-4-E4B (diverse pair)"
    overrides:
      mode: manager
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both}
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}

  # How MiMo thinks in the coordinator role (2026-10-04): same team as mgr-both-same, only the
  # coordinator's way of deciding and writing changes.
  mgr-both-same-stepback:
    description: "as mgr-both-same, but MiMo steps back before each decision and before writing (its best strategy in the strategy study)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-4B], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: step_back}
  mgr-both-same-think:
    description: "as mgr-both-same, but MiMo uses its built-in thinking (up to ~1000 tokens) for each decision and for the answer"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-4B], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}

  # Combined (2026-10-05): thinking coordinator x (identical vs diverse pair) x (with / without a
  # fact-checker for facts only ONE teammate found). Granite-4.1-3B checks (98% on the verifier bench;
  # not Gemma, so Gemma's own finds aren't checked by Gemma).
  mgr-duo-think:
    description: "thinking MiMo + Qwen3.5-4B and Gemma-4-E4B, every task to both"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: MiMo-V2.6-Distill-Qwen-9B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-same-think-verify:
    description: "thinking MiMo + 2x Qwen3.5-4B, every task to both; Granite fact-checks facts only one found"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-4B], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: true}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-duo-think-verify:
    description: "thinking MiMo + Qwen3.5-4B and Gemma-4-E4B, every task to both; Granite fact-checks facts only one found"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: true}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}

  # Experts (2026-10-06): base = thinking MiMo + Qwen3.5-4B and Gemma-4-E4B (every task to both; Chris
  # keeps Gemma for its lone finds; no fact-checker: it confirmed 189/199 lone finds and doubled the time),
  # MiMo 16k / workers 8k: MiMo 32k + workers 16k measured 15.2 GB, over the 14.5 GB budget, and the two
  # workers swapped on every task (192 s/question); the largest prompts last run were ~6.7k tokens. Adds structured worker reports, a
  # "try harder" control (more turns + thinking, no expert) and a bigger expert MiMo can call when a
  # step is stuck (max 2 calls; a blocked repeat goes to the expert automatically). Gemma-12B Q5 +
  # MiMo don't fit the card together, so MiMo is unloaded while the expert works (fast evict).
  mgr-ex-base:
    description: "thinking MiMo + Qwen3.5-4B and Gemma-4-E4B, every task to both"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-ex-reports:
    description: "as mgr-ex-base, but workers send structured reports (what the passages said, answer, what's missing and why, suggested next step + search, confidence and why)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, reports: true}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-ex-harder:
    description: "as mgr-ex-reports, but MiMo gets 10 turns and 2000 thinking tokens (try-harder control, no expert)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 10, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 2000, verify: false, reports: true}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-ex-qwen9:
    description: "as mgr-ex-reports, plus expert Qwen3.5-9B (Q5) MiMo can call when stuck (max 2 calls, may run 1 follow-up search)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, reports: true, expert: {model: Qwen3.5-9B, ctx_per_slot: 16384, max_calls: 2, followup_searches: 1, auto: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo], pinned_evict_after_s: 2}
  mgr-ex-gemma12:
    description: "as mgr-ex-reports, plus expert Gemma-4-12B-it (Q5) MiMo can call when stuck (max 2 calls, may run 1 follow-up search)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, reports: true, expert: {model: Gemma-4-12B-it-Q5, ctx_per_slot: 16384, max_calls: 2, followup_searches: 1, auto: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo], pinned_evict_after_s: 2}
  mgr-ex-ornith:
    description: "as mgr-ex-reports, plus expert Ornith-1.5-9B (Q5, search-agent RL) MiMo can call when stuck (max 2 calls, may run 1 follow-up search)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, reports: true, expert: {model: Ornith-1.5-9B, ctx_per_slot: 16384, max_calls: 2, followup_searches: 1, auto: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo], pinned_evict_after_s: 2}

  # Vote (2026-10-06): the experts run's best lever is variance (71/100 right in at least one setup,
  # 21 in all six; a plain majority vote over 3 setups scored 56-57% vs 52% best single). Run the base
  # loop 3 times independently and let MiMo compare the answers (swarm/attempts.py).
  mgr-vote3-same:
    description: "base team 3 times (temperature 0.2 / 0.7 / 0.7), then MiMo votes"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}]}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-vote3-resolve-q38:
    description: "mgr-vote3-same, then when the 3 attempts disagree the workers are unloaded and Qwen3.8-27B (all on the GPU) answers from the research packet"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}], resolver: {model: Qwen3.8-27B, ctx: 16384, max_tokens: 1500, when: split, min_free_ram_mb: 1500}}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  # Big coordinator trial (2026-10-10, Chris): does a team of small workers add capability to a big model?
  # Gemma-4-12B-it (QAT 4-bit, 7 GB, fits the GPU alone) directs; it is not pinned, so the pool unloads it while the
  # teammates run. Teammates work in sets (worker_sets, by position in the team): each set side by side, the sets one
  # after the other, so only one set sits on the GPU at a time. Same loop, prompts, research and sources as mgr-ex-base.
  big12-alone:
    description: "Gemma-4-12B directs the manager loop and does every step itself (the control: no team)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: Gemma-4-12B-it, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Gemma-4-12B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, coordinator_style: plain, verify: false, pin_coordinator: false}
  big12-team2:
    description: "Gemma-4-12B directs Qwen3.5-4B + Gemma-4-E4B (one set), every task to both"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: Gemma-4-12B-it, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: plain, verify: false, pin_coordinator: false, worker_sets: [[0, 1]]}
  big12-team4:
    description: "Gemma-4-12B directs two sets, each a small and a bigger model: Qwen3.5-4B + Qwen3.5-9B, then Gemma-4-E4B + Apertus-8B"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: Gemma-4-12B-it, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Qwen3.5-9B, Gemma-4-E4B-it, Apertus-v1.5-8B], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: plain, verify: false, pin_coordinator: false, worker_sets: [[0, 1], [2, 3]]}
  mgr-vote3-diverse:
    description: "3 attempts with different worker pairs (Qwen+Gemma t0.2, Qwen+Qwen t0.7, Gemma+Gemma t0.7), then MiMo votes"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7, team: [Qwen3.5-4B, Qwen3.5-4B]}, {temperature: 0.7, team: [Gemma-4-E4B-it, Gemma-4-E4B-it]}]}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-vote-adaptive:
    description: "as mgr-vote3-diverse, but stops after 2 attempts when they agree (3rd attempt only on disagreement)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, attempts: {adaptive: true, runs: [{temperature: 0.2}, {temperature: 0.7, team: [Qwen3.5-4B, Qwen3.5-4B]}, {temperature: 0.7, team: [Gemma-4-E4B-it, Gemma-4-E4B-it]}]}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}

  # Trust check (2026-10-06, Chris's partner charter: trusted -> tells the truth -> shows its work -> reliable).
  # Before finishing, MiMo lays out the chain its answer rests on (claim, cited passages, supported /
  # inferred / unsupported / conflict, the arithmetic, every part answered?). Code checks the citations
  # and recomputes the arithmetic; Qwen3.5-4B re-checks the steps MiMo calls supported. Gaps send the
  # team back to work (max 2 times, up to 3 extra turns); remaining gaps go to the writer to state honestly.
  # Main question: is MiMo capable of following it (does "ready" predict right answers? how often does it
  # over-claim support?), and does it raise accuracy / honesty.
  mgr-trust:
    description: "base team + trust check before finishing (MiMo's chain checked by code and by Qwen3.5-4B)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, trust_check: {rounds: 2, extra_cycles: 3, verify: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-trust-self:
    description: "base team + trust check, MiMo's own judgment only (code checks citations and arithmetic; no second model)"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, trust_check: {rounds: 2, extra_cycles: 3, verify: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
# Scaling run: 8 independent attempts per question (t0.2 then 7 x t0.7), every one saved and graded,
# then MiMo votes over all 8. Subsets give the curve for 1..8 attempts offline. Pick the variant that
# matches the trust study's winner.
  mgr-scale8:
    description: "base team x8 attempts (t0.2, then 0.7 x7), MiMo votes over all 8; every attempt graded"
    run_timeout_seconds: 5400
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}], adaptive: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-scale8-charter:
    description: "as mgr-scale8, with the partner charter nudge in every prompt"
    run_timeout_seconds: 5400
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, charter: {lead: true, workers: true}, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}], adaptive: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-scale8-trust:
    description: "as mgr-scale8, with the trust check (Qwen3.5-4B re-check) in every attempt"
    run_timeout_seconds: 5400
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, trust_check: {rounds: 2, extra_cycles: 3, verify: true}, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}], adaptive: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-scale8-trust-all:
    description: "as mgr-scale8, with the trust check and the charter nudge in every attempt"
    run_timeout_seconds: 5400
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, charter: {lead: true, workers: true}, trust_check: {rounds: 2, extra_cycles: 3, verify: true}, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}], adaptive: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-scale8-trust-self:
    description: "as mgr-scale8, with the trust check on MiMo's own judgment in every attempt"
    run_timeout_seconds: 5400
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, trust_check: {rounds: 2, extra_cycles: 3, verify: false}, attempts: {runs: [{temperature: 0.2}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}, {temperature: 0.7}], adaptive: false}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-charter-all:
    description: "base team with the partner charter as a short nudge in every prompt (MiMo's and the workers'); no trust check"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, charter: {lead: true, workers: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}
  mgr-trust-all:
    description: "mgr-trust (trust check, verified by Qwen3.5-4B) plus the charter nudge in every prompt"
    overrides:
      mode: manager
      research: {passages_per_subquestion: 15}
      coordinator: {model: MiMo-V2.6-Distill-Qwen-9B, ctx_per_slot: 16384, parallel: 1}
      verifier: {model: Granite-4.1-3B}
      workers: {team: [Qwen3.5-4B, Gemma-4-E4B-it], ctx_per_slot: 8192}
      manager: {max_cycles: 6, passages_per_task: 6, pages_per_search: 3, dispatch: both, coordinator_style: think, think_tokens: 1000, verify: false, charter: {lead: true, workers: true}, trust_check: {rounds: 2, extra_cycles: 3, verify: true}}
      gpu: {keep_reasoning_models: [gpt-oss, MiMo]}

# Templates filled in once per value; each also becomes a group of the same name.
matrices:
  # Every general chat model alone, reading the same evidence and writing the answer:
  # measures reading + synthesis skill (candidate coordinators, and the "one big model" opponents).
  solo-tournament:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: &research_models
      - Qwen3.5-0.8B
      - Qwen3.5-2B
      - Qwen3.5-2B-Reasoning-Distill
      - Qwen3.5-4B
      - Qwen3.5-9B
      - Qwen3-0.6B
      - Qwen3-1.7B
      - Ministral-3-3B-Instruct
      - Ministral-3-3B-Reasoning
      - Ministral-3-8B-Instruct
      - LFM2.5-1.2B-Instruct
      - LFM2.5-2.6B
      - LFM2.5-8B-A1B
      - Granite-4.0-1B-Instruct
      - Granite-4.1-3B
      - Granite-4.2-8B
      - Gemma-3-270M-it
      - Gemma-4-E2B-it
      - Gemma-4-E4B-it
      - Phi-4-mini-instruct
      - SmolLM2-1.7B-Instruct
      - SmolLM3-3B
      - MiniCPM5-1B
      - MiniCPM5-2B
      - NVIDIA-Nemotron-3-Nano-4B
      - OLMo-2-7B-Instruct
      - Falcon-H1-0.5B-Instruct
      - DeepSeek-R1-Distill-Qwen-1.5B
      - DeepSeek-R1-1.5B-Structured-JSON
      - BitNet-b1.58-2B-4T
      - Ministral-3-14B-Instruct   # also the judge: its own answers may be graded kindly

  # Every model as the ONLY worker (same coordinator Qwen3.5-4B and fact checker Granite-4.1-3B):
  # measures the worker job - short cited answers whose claims the fact checker can confirm.
  worker-tournament:
    name: "worker-{model}"
    description: "{model} as the only worker (+ Granite fact checker + Qwen3.5-4B coordinator)"
    overrides: {workers: {team: ["{model}"]}}
    models:
      - Qwen3.5-0.8B
      - Qwen3.5-2B
      - Qwen3.5-2B-Reasoning-Distill
      - Qwen3.5-4B
      - Qwen3.5-9B
      - Qwen3-0.6B
      - Qwen3-1.7B
      - Ministral-3-3B-Instruct
      - Ministral-3-3B-Reasoning
      - Ministral-3-8B-Instruct
      - LFM2.5-1.2B-Instruct
      - LFM2.5-2.6B
      - LFM2.5-8B-A1B
      - Granite-4.0-1B-Instruct
      - Granite-4.1-3B
      - Granite-4.2-8B
      - Gemma-3-270M-it
      - Gemma-4-E2B-it
      - Gemma-4-E4B-it
      - Phi-4-mini-instruct
      - SmolLM2-1.7B-Instruct
      - SmolLM3-3B
      - MiniCPM5-1B
      - MiniCPM5-2B
      - NVIDIA-Nemotron-3-Nano-4B
      - OLMo-2-7B-Instruct
      - Falcon-H1-0.5B-Instruct
      - DeepSeek-R1-Distill-Qwen-1.5B
      - DeepSeek-R1-1.5B-Structured-JSON
      - BitNet-b1.58-2B-4T

  # The biggest models this PC can run, each ALONE reading the same evidence (the opponents the swarm
  # has to beat). Models bigger than the card run split between GPU and system RAM (slower).
  heavyweights:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models:
      - gpt-oss-20b                    # 20B mixture-of-experts (3.6B active), fits on the card
      - Qwen3-14B                      # 14B dense
      - DeepSeek-R1-Distill-Qwen-14B   # 14B dense, reasoning-tuned
      - Gemma-4-26B-A4B-it             # 26B mixture-of-experts (4B active), GPU + RAM
      - Qwen3.6-35B-A3B                # 35B mixture-of-experts (3B active), GPU + RAM, maxes the PC
      - Qwen3.6-27B                    # 27B dense, GPU + RAM
      - Gemma-4-31B-it                 # 31B dense, GPU + RAM

  # One worker, each reasoning strategy (compare with worker-Ministral-3-3B-Instruct / worker-LFM2.5-2.6B = direct)
  strategy-ministral:
    name: "ministral-{value}"
    description: "Ministral as the only worker, thinking with: {value}"
    overrides: {workers: {team: [Ministral-3-3B-Instruct], strategy: "{value}"}}
    values: &strategies [linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]
  strategy-lfm:
    name: "lfm-{value}"
    description: "LFM2.5-2.6B as the only worker, thinking with: {value}"
    overrides: {workers: {team: [LFM2.5-2.6B], strategy: "{value}"}}
    values: *strategies

  # ---- STRATEGY SCREEN: which way of thinking suits each answer-worker model? ----
  # Each model is the only worker and tries every way of thinking on the same questions and the same
  # saved evidence. No coordinator: the worker's own answers are graded, so the grade measures the
  # worker (and the Granite fact checker still reports how many of its claims hold up).
  strategy-screen:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models: &screen_models [Qwen3.5-9B, Gemma-4-E4B-it, Ministral-3-8B-Instruct]
    values: [direct, linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]
  # the model's own trained thinking mode (only models that have one)
  strategy-screen-native:
    name: "screen-{model}-native"
    description: "{model} alone, using its own built-in thinking mode (worker answers graded directly)"
    overrides:
      gpu: {keep_reasoning_models: [gpt-oss, "{model}"]}
      workers: {team: ["{model}"], strategy: native, screen: true, ctx_per_slot: 8192, think_tokens: 3000}
    models: [Qwen3.5-9B, Gemma-4-E4B-it]
  # the other three mid-size models (they fill fact-sheet / premise / skeptic / verifier jobs, which
  # don't use a way of thinking, so this is only needed if they might become answerers)
  strategy-screen-extra:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models: [Granite-4.2-8B, OLMo-2-7B-Instruct, LFM2.5-8B-A1B]
    values: [direct, linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]

  # ---- COORDINATOR BAKE-OFF: the best small swarm (roles-2ways-split: same workers, same roles,
  # per-part research) with only the coordinator changed. Every candidate fits entirely on the
  # graphics card (the 35B coordinator spilled into RAM and restarted the PC twice).
  coordinator-bakeoff-swarms:
    name: "coord-{model}"
    description: "best small swarm (roles-2ways-split) with {model} as coordinator"
    overrides:
      coordinator: {model: "{model}", ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}
    models: &bakeoff_coords
      - Qwen3.5-9B                  # have it; 81 alone on live research
      - Gemma-4-12B-it              # Google QAT 4-bit, 7 GB
      - Qwen3.8-27B                 # newest Qwen 27B, 3-bit (UD-IQ3_XXS), 10.9 GB
      - Bonsai-2-27B                # Qwen3.8-27B in ternary weights (PQ2_0), 7.2 GB, PrismML llama.cpp
      - Ministral-3-14B-Instruct    # also the main judge: checked by the second judge (--judge2)
  # the new candidates alone (how good is each model by itself?)
  coordinator-bakeoff-solos:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: [Gemma-4-12B-it, Qwen3.8-27B, Bonsai-2-27B]

  # ---- ROUND 2 (2026-09-29): new small models, incl. the second-tier labs that do the most open work ----
  # Each candidate alone as the worker, answering directly and with the two ways of thinking that won
  # the strategy study (step back, self-ask), on the SAME saved evidence and 23 questions as that study,
  # so the numbers line up with screen-Qwen3.5-9B / Gemma / Ministral from 20260928-1323.
  strategy-screen-round2:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models:
      - Olmo-3-7B-Instruct            # Ai2 (replaces OLMo-2)
      - NVIDIA-Nemotron-Nano-9B-v2    # NVIDIA
      - Falcon-H1R-7B                 # TII, reasoning-tuned
      - MiMo-V2.6-Distill-Qwen-9B     # Xiaomi (fine-tune of Qwen3.5-9B)
      - Granite-4.2-3B                # IBM (upgrade of Granite-4.1-3B)
      - Granite-4.2-8B                # IBM (have it; never screened)
      - Kanana-2-3B-Instruct          # Kakao
      - Jamba2-3B                     # AI21 (hybrid Mamba)
      - Apertus-v1.5-8B               # Swiss AI
      - rnj-1.5-Instruct              # Essential AI
      - Qwen3.5-9B                    # references from round 1, same session
      - Gemma-4-E4B-it
    values: [direct, step_back, self_ask]
  # Round 3 workers (2026-10-01): new lineages from the lab catalog, same saved evidence and 23
  # questions as round 2, with the same two references so the rounds line up
  strategy-screen-round3:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models:
      - Llama-3.1-8B-Instruct         # Meta
      - Llama-3.2-3B-Instruct         # Meta (small)
      - Command-R7B                   # Cohere (grounded answers with citations)
      - AFM-4.5B                      # Arcee AI
      - EXAONE-4.0-1.2B               # LG AI Research
      - GLM-4-9B-0414                 # Zhipu / Z.ai
      - Qwen3.5-9B                    # references, as in rounds 1 and 2
      - Gemma-4-E4B-it
    values: [direct, step_back, self_ask]
  # Coordinator bake-off, round 2: more candidates that fit on the card (run after round 1)
  coordinator-bakeoff2-swarms:
    name: "coord-{model}"
    description: "best small swarm (roles-2ways-split) with {model} as coordinator"
    overrides:
      coordinator: {model: "{model}", ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}
    models: &bakeoff2_coords
      - MiMo-V2.6-Distill-Qwen-9B      # Xiaomi
      - HyperCLOVAX-SEED-Think-14B     # NAVER
      - Apriel-1.6-15B-Thinker         # ServiceNow
      - Phi-4-reasoning-vision-15B     # Microsoft
      - ERNIE-4.5-21B-A3B-Thinking     # Baidu, MoE, 3-bit so it fits on the card
  coordinator-bakeoff2-solos:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: *bakeoff2_coords
  # ---- RERANKER: a model that re-orders search passages by relevance before the models read them ----
  # (FRAMES: 50-68% of answers were "couldn't find it" - choosing the right passages is the bottleneck)

# Named groups you can pass to --configs
groups:
  baseline: [swarm-mixed, coordinator-only, single-large, same-model-x3]
  team-size: [coordinator-only, swarm-t1, swarm-t2, swarm-t3, swarm-t4, swarm-t5]
  roles-study: [coordinator-only, swarm-t2, swarm-roles]
  team-diversity: [swarm-t3, team-clones, team-1model-3ways, team-3models-3ways, swarm-t2, team-2models-2ways, swarm-roles, roles-no-premise, roles-2ways, coordinator-only]
  # the long overnight study: every model in every research job, every strategy, and team variety
  # big single models vs the swarm, measured on the same evidence (+ the current swarm and the
  # coordinator alone as reference points from the same session)
  heavyweight-study: [heavyweights, bigcoord-gptoss, bigcoord-qwen36, roles-no-premise, coordinator-only, solo-x4-Qwen3.5-4B, solo-x8-Qwen3.5-4B]
  # tonight: everything that matters, LIVE (each run does its own research), fastest first
  overnight-live: [coordinator-only, team-clones, clones-split, roles-2ways, roles-2ways-split, swarm-t3,
                   solo-x4-Qwen3.5-4B, solo-x8-Qwen3.5-4B, solo-Qwen3.5-9B,
                   solo-gpt-oss-20b, solo-Qwen3-14B, solo-DeepSeek-R1-Distill-Qwen-14B, bigcoord-gptoss,
                   solo-Gemma-4-26B-A4B-it, solo-Qwen3.6-35B-A3B, bigcoord-qwen36,
                   solo-Qwen3.6-27B, solo-Gemma-4-31B-it]
  # External validity study: the configurations that did best on our own questions, FROZEN before
  # any GAIA / FRAMES result is seen (evals/frozen/external-v1.json) and run unchanged on
  # GAIA, FRAMES and the 63 post-training questions:
  #   one 4B pass | the same 4B with a swarm-sized budget (8 drafts) | 9B alone | 35B MoE alone |
  #   best small swarm (roles, 2 ways of thinking, per-part research) | same swarm with the 35B coordinating
  external-v1: [coordinator-only, solo-x8-Qwen3.5-4B, solo-Qwen3.5-9B, solo-Qwen3.6-35B-A3B,
                roles-2ways-split, bigcoord-qwen36]
  round2-screen: [strategy-screen-round2]
  round3-screen: [strategy-screen-round3]
  notebook-study: [nb-big, nb-none, nb-tiny, nb-same3, diverse-separate, solo-MiMo-V2.6-Distill-Qwen-9B, coordinator-only]
  notebook-v2: [nb2-big, nb2-cpu-qwen4b, nb2-cpu-qwen2b, nb2-cpu-lfm, solo-MiMo-V2.6-Distill-Qwen-9B, coordinator-only]
  notebook-v3: [solo-MiMo-V2.6-Distill-Qwen-9B, solo-MiMo-wide, nb3-wide, nb3-wide-same3, diverse-separate-wide]
  manager-study: [solo-MiMo-wide, mgr-alone, mgr-same2, mgr-duo]
  manager-both: [solo-MiMo-wide, mgr-both-same, mgr-both-duo, mgr-both-same-think, mgr-both-same-stepback]
  manager-combined: [solo-MiMo-wide, mgr-both-same-think, mgr-duo-think, mgr-same-think-verify, mgr-duo-think-verify]
  manager-experts: [solo-MiMo-wide, mgr-ex-base, mgr-ex-reports, mgr-ex-harder, mgr-ex-qwen9, mgr-ex-gemma12, mgr-ex-ornith]
  # does the team add to a big model? Gemma-12B alone vs with 2 vs with 4 teammates; MiMo + team is the in-session anchor
  big-coordinator: [mgr-ex-base, big12-alone, big12-team2, big12-team4]
  manager-vote: [solo-MiMo-wide, mgr-ex-base, mgr-vote3-same, mgr-vote3-diverse, mgr-vote-adaptive]
  manager-trust: [solo-MiMo-wide, mgr-ex-base, mgr-charter-all, mgr-trust, mgr-trust-all, mgr-trust-self]
  # v2 vs its best member alone and vs the bake-off winner (MiMo coordinating the old roles team)
  # plus coordinator-only as an in-session anchor: live scores drift by day (roles-2ways-split 65% on
  # 9-30 vs 53% on 10-03 on the same questions), so v2 must be compared within its own run
  external-v2: [v2-swarm, v2-swarm-rerank4b, solo-MiMo-V2.6-Distill-Qwen-9B, coord-MiMo-V2.6-Distill-Qwen-9B,
                coordinator-only]
  coordinator-bakeoff2: [coordinator-bakeoff2-swarms, coordinator-bakeoff2-solos]
  reranker-study: [coordinator-only, rerank06-coordinator-only, rerank4b-coordinator-only, roles-2ways-split, rerank4b-roles-2ways-split]
  # coordinator bake-off: current best swarm (4B coordinator) vs the same swarm with each candidate
  coordinator-bakeoff: [roles-2ways-split, coordinator-bakeoff-swarms, coordinator-bakeoff-solos]
  # tonight: the answer-worker candidates, every way of thinking (built-in thinking last: slowest)
  strategy-study: [strategy-screen, strategy-screen-native]
  big-study: [worker-tournament, solo-tournament, strategy-ministral, strategy-lfm, team-diversity]

# Run these when no --configs are given
default: [swarm-mixed, coordinator-only, single-large, same-model-x3]

# Answers slower than this are flagged in the report (research-level questions)
time_target_seconds: 90

# The judge grades every answer against the question's must / must_not list.
# Use the strongest model that fits alone on the GPU, ideally from a lineage
# that is not the coordinator's. It sees the rubric, not the evidence.
judge:
  model: Ministral-3-14B-Instruct
  ctx_per_slot: 8192
  parallel: 1
  # second look when the judge says "incorrect": compare the extracted answer with the reference alone
  # (fixes judge false negatives, see the grader audit). Changes the rubric key, so old grades get redone.
  recheck: true
# optional cross-check (--judge2): a judge from a different family, used when the main judge's
# own model is one of the contestants (e.g. Ministral-14B as a coordinator in the bake-off)
judge2:
  model: gpt-oss-20b
  ctx_per_slot: 8192
  parallel: 1
