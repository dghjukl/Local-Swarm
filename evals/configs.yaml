# Configurations the eval harness compares. Each one is config/swarm.yaml plus the overrides below.
# mode: swarm = full team (plan -> workers -> verifier -> synthesis)
#       solo  = the coordinator alone reads the same evidence and answers (no team, no verifier)
# Every configuration gets the SAME sub-questions and the SAME fetched sources for a question,
# so differences in the score come from the models, not from luck in web search.

configs:
  swarm-mixed:
    description: Mixed team from different labs (the current default swarm)
    overrides: {}

  coordinator-only:
    description: Qwen3.5-4B alone reads the evidence and answers
    overrides:
      mode: solo

  single-large:
    description: One bigger model (Qwen3.5-9B) alone reads the evidence and answers
    overrides:
      mode: solo
      coordinator: {model: Qwen3.5-9B, ctx_per_slot: 16384, parallel: 1}

  same-model-x3:
    description: Three copies of one small model (Phi-4-mini) instead of three labs
    overrides:
      workers:
        team: [Phi-4-mini-instruct, Phi-4-mini-instruct, Phi-4-mini-instruct]
        temperature: 0.7   # some variety between the copies

  # ---- team-size study: 1 to 5 workers from different labs (+ verifier + coordinator) ----
  # Workers are taken in order from workers.pool in config/swarm.yaml, one per lineage:
  # Ministral (Mistral), LFM2.5 (Liquid), Phi-4-mini (Microsoft), Gemma-4-E2B (Google), SmolLM3 (Hugging Face)
  swarm-t1:
    description: 1 worker (Ministral) + verifier + coordinator
    overrides: {workers: {team_size: 1}}
  swarm-t2:
    description: 2 workers + verifier + coordinator
    overrides: {workers: {team_size: 2}}
  swarm-t3:
    description: 3 workers + verifier + coordinator (same as swarm-mixed)
    overrides: {workers: {team_size: 3}}
  swarm-t4:
    description: 4 workers + verifier + coordinator
    overrides: {workers: {team_size: 4}}
  swarm-t5:
    description: 5 workers + verifier + coordinator (more than fits on the GPU at once)
    overrides: {workers: {team_size: 5}}

  # ---- roles study: different jobs instead of clones (no extra VRAM: reuses the same 3 small models) ----
  swarm-roles:
    description: 2 answerers + fact sheet + premise check + skeptic (reviews verified claims)
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- reranker study: same setups, passages chosen by Qwen3-Reranker instead of keyword ranking ----
  rerank4b-coordinator-only:
    description: "coordinator-only, passages chosen by Qwen3-Reranker-4B"
    overrides: {research: {reranker: Qwen3-Reranker-4B}}
  rerank06-coordinator-only:
    description: "coordinator-only, passages chosen by Qwen3-Reranker-0.6B"
    overrides: {research: {reranker: Qwen3-Reranker-0.6B}}
  rerank4b-roles-2ways-split:
    description: "roles-2ways-split, passages chosen by Qwen3-Reranker-4B"
    overrides:
      research: {split_by_subquestion: true, reranker: Qwen3-Reranker-4B}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- team diversity: where does a team's variety help - different models or different ways of thinking? ----
  # (strategies come from MCP/reasoning-mcp; see swarm/strategies.py)
  team-clones:
    description: "Ministral x3, all answering directly (the clone baseline, temperature 0.7)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct], temperature: 0.7}}
  team-1model-3ways:
    description: "Ministral x3, each thinking a different way (self-ask, step back, tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct],
                          strategies: [self_ask, step_back, tree_of_thoughts]}}
  team-3models-3ways:
    description: "Ministral, LFM, Phi, each thinking a different way (self-ask, step back, tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, LFM2.5-2.6B, Phi-4-mini-instruct],
                          strategies: [self_ask, step_back, tree_of_thoughts]}}
  team-2models-2ways:
    description: "Ministral (self-ask) + LFM (tree of thoughts)"
    overrides: {workers: {team: [Ministral-3-3B-Instruct, LFM2.5-2.6B], strategies: [self_ask, tree_of_thoughts]}}
  roles-no-premise:
    description: "2 answerers + fact sheet + skeptic (no premise check)"
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}
  roles-2ways:
    description: "swarm-roles, with the two answerers thinking differently (self-ask, tree of thoughts)"
    overrides:
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

  # A big coordinator that takes turns with the team: the team runs with the whole card, then the
  # team is unloaded and the big model writes the answer (the "time-shared coordinator" idea).
  bigcoord-gptoss:
    description: "fact sheet + skeptic team, gpt-oss-20b writes the final answer (takes turns on the GPU)"
    overrides:
      research: {split_by_subquestion: true}
      coordinator: {model: gpt-oss-20b, ctx_per_slot: 12288, parallel: 1}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}
  bigcoord-qwen36:
    description: "fact sheet + skeptic team, Qwen3.6-35B-A3B (GPU + RAM) writes the final answer"
    overrides:
      research: {split_by_subquestion: true}
      coordinator: {model: Qwen3.6-35B-A3B, ctx_per_slot: 12288, parallel: 1}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct}
          - {role: answerer, model: LFM2.5-2.6B}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: skeptic,  model: Granite-4.1-3B}

  # ---- equal-compute baselines: ONE model spends a swarm-sized token budget (several drafts, then merges them)
  solo-x4-Qwen3.5-4B:
    description: "Qwen3.5-4B alone, 4 drafts merged into one answer (same model, more compute)"
    overrides: {mode: solo, solo_samples: 4}
  solo-x8-Qwen3.5-4B:
    description: "Qwen3.5-4B alone, 8 drafts merged into one answer"
    overrides: {mode: solo, solo_samples: 8}

  # ---- swarm-style research: each part of the question is searched separately (only matters in --live runs)
  clones-split:
    description: "Ministral x3 (clones), and each part of the question gets its own web research"
    overrides:
      research: {split_by_subquestion: true}
      workers: {team: [Ministral-3-3B-Instruct, Ministral-3-3B-Instruct, Ministral-3-3B-Instruct], temperature: 0.7}
  roles-2ways-split:
    description: "roles-2ways (answerers thinking 2 ways + fact sheet + premise + skeptic) with per-part web research"
    overrides:
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}

# Templates filled in once per value; each also becomes a group of the same name.
matrices:
  # Every general chat model alone, reading the same evidence and writing the answer:
  # measures reading + synthesis skill (candidate coordinators, and the "one big model" opponents).
  solo-tournament:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: &research_models
      - Qwen3.5-0.8B
      - Qwen3.5-2B
      - Qwen3.5-2B-Reasoning-Distill
      - Qwen3.5-4B
      - Qwen3.5-9B
      - Qwen3-0.6B
      - Qwen3-1.7B
      - Ministral-3-3B-Instruct
      - Ministral-3-3B-Reasoning
      - Ministral-3-8B-Instruct
      - LFM2.5-1.2B-Instruct
      - LFM2.5-2.6B
      - LFM2.5-8B-A1B
      - Granite-4.0-1B-Instruct
      - Granite-4.1-3B
      - Granite-4.2-8B
      - Gemma-3-270M-it
      - Gemma-4-E2B-it
      - Gemma-4-E4B-it
      - Phi-4-mini-instruct
      - SmolLM2-1.7B-Instruct
      - SmolLM3-3B
      - MiniCPM5-1B
      - MiniCPM5-2B
      - NVIDIA-Nemotron-3-Nano-4B
      - OLMo-2-7B-Instruct
      - Falcon-H1-0.5B-Instruct
      - DeepSeek-R1-Distill-Qwen-1.5B
      - DeepSeek-R1-1.5B-Structured-JSON
      - BitNet-b1.58-2B-4T
      - Ministral-3-14B-Instruct   # also the judge: its own answers may be graded kindly

  # Every model as the ONLY worker (same coordinator Qwen3.5-4B and fact checker Granite-4.1-3B):
  # measures the worker job - short cited answers whose claims the fact checker can confirm.
  worker-tournament:
    name: "worker-{model}"
    description: "{model} as the only worker (+ Granite fact checker + Qwen3.5-4B coordinator)"
    overrides: {workers: {team: ["{model}"]}}
    models:
      - Qwen3.5-0.8B
      - Qwen3.5-2B
      - Qwen3.5-2B-Reasoning-Distill
      - Qwen3.5-4B
      - Qwen3.5-9B
      - Qwen3-0.6B
      - Qwen3-1.7B
      - Ministral-3-3B-Instruct
      - Ministral-3-3B-Reasoning
      - Ministral-3-8B-Instruct
      - LFM2.5-1.2B-Instruct
      - LFM2.5-2.6B
      - LFM2.5-8B-A1B
      - Granite-4.0-1B-Instruct
      - Granite-4.1-3B
      - Granite-4.2-8B
      - Gemma-3-270M-it
      - Gemma-4-E2B-it
      - Gemma-4-E4B-it
      - Phi-4-mini-instruct
      - SmolLM2-1.7B-Instruct
      - SmolLM3-3B
      - MiniCPM5-1B
      - MiniCPM5-2B
      - NVIDIA-Nemotron-3-Nano-4B
      - OLMo-2-7B-Instruct
      - Falcon-H1-0.5B-Instruct
      - DeepSeek-R1-Distill-Qwen-1.5B
      - DeepSeek-R1-1.5B-Structured-JSON
      - BitNet-b1.58-2B-4T

  # The biggest models this PC can run, each ALONE reading the same evidence (the opponents the swarm
  # has to beat). Models bigger than the card run split between GPU and system RAM (slower).
  heavyweights:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models:
      - gpt-oss-20b                    # 20B mixture-of-experts (3.6B active), fits on the card
      - Qwen3-14B                      # 14B dense
      - DeepSeek-R1-Distill-Qwen-14B   # 14B dense, reasoning-tuned
      - Gemma-4-26B-A4B-it             # 26B mixture-of-experts (4B active), GPU + RAM
      - Qwen3.6-35B-A3B                # 35B mixture-of-experts (3B active), GPU + RAM, maxes the PC
      - Qwen3.6-27B                    # 27B dense, GPU + RAM
      - Gemma-4-31B-it                 # 31B dense, GPU + RAM

  # One worker, each reasoning strategy (compare with worker-Ministral-3-3B-Instruct / worker-LFM2.5-2.6B = direct)
  strategy-ministral:
    name: "ministral-{value}"
    description: "Ministral as the only worker, thinking with: {value}"
    overrides: {workers: {team: [Ministral-3-3B-Instruct], strategy: "{value}"}}
    values: &strategies [linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]
  strategy-lfm:
    name: "lfm-{value}"
    description: "LFM2.5-2.6B as the only worker, thinking with: {value}"
    overrides: {workers: {team: [LFM2.5-2.6B], strategy: "{value}"}}
    values: *strategies

  # ---- STRATEGY SCREEN: which way of thinking suits each answer-worker model? ----
  # Each model is the only worker and tries every way of thinking on the same questions and the same
  # saved evidence. No coordinator: the worker's own answers are graded, so the grade measures the
  # worker (and the Granite fact checker still reports how many of its claims hold up).
  strategy-screen:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models: &screen_models [Qwen3.5-9B, Gemma-4-E4B-it, Ministral-3-8B-Instruct]
    values: [direct, linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]
  # the model's own trained thinking mode (only models that have one)
  strategy-screen-native:
    name: "screen-{model}-native"
    description: "{model} alone, using its own built-in thinking mode (worker answers graded directly)"
    overrides:
      gpu: {keep_reasoning_models: [gpt-oss, "{model}"]}
      workers: {team: ["{model}"], strategy: native, screen: true, ctx_per_slot: 8192, think_tokens: 3000}
    models: [Qwen3.5-9B, Gemma-4-E4B-it]
  # the other three mid-size models (they fill fact-sheet / premise / skeptic / verifier jobs, which
  # don't use a way of thinking, so this is only needed if they might become answerers)
  strategy-screen-extra:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models: [Granite-4.2-8B, OLMo-2-7B-Instruct, LFM2.5-8B-A1B]
    values: [direct, linear, chain_of_thought, self_ask, step_back, self_consistency, tree_of_thoughts, scratchpad]

  # ---- COORDINATOR BAKE-OFF: the best small swarm (roles-2ways-split: same workers, same roles,
  # per-part research) with only the coordinator changed. Every candidate fits entirely on the
  # graphics card (the 35B coordinator spilled into RAM and restarted the PC twice).
  coordinator-bakeoff-swarms:
    name: "coord-{model}"
    description: "best small swarm (roles-2ways-split) with {model} as coordinator"
    overrides:
      coordinator: {model: "{model}", ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}
    models: &bakeoff_coords
      - Qwen3.5-9B                  # have it; 81 alone on live research
      - Gemma-4-12B-it              # Google QAT 4-bit, 7 GB
      - Qwen3.8-27B                 # newest Qwen 27B, 3-bit (UD-IQ3_XXS), 10.9 GB
      - Bonsai-2-27B                # Qwen3.8-27B in ternary weights (PQ2_0), 7.2 GB, PrismML llama.cpp
      - Ministral-3-14B-Instruct    # also the main judge: checked by the second judge (--judge2)
  # the new candidates alone (how good is each model by itself?)
  coordinator-bakeoff-solos:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: [Gemma-4-12B-it, Qwen3.8-27B, Bonsai-2-27B]

  # ---- ROUND 2 (2026-09-29): new small models, incl. the second-tier labs that do the most open work ----
  # Each candidate alone as the worker, answering directly and with the two ways of thinking that won
  # the strategy study (step back, self-ask), on the SAME saved evidence and 23 questions as that study,
  # so the numbers line up with screen-Qwen3.5-9B / Gemma / Ministral from 20260928-1323.
  strategy-screen-round2:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models:
      - Olmo-3-7B-Instruct            # Ai2 (replaces OLMo-2)
      - NVIDIA-Nemotron-Nano-9B-v2    # NVIDIA
      - Falcon-H1R-7B                 # TII, reasoning-tuned
      - MiMo-V2.6-Distill-Qwen-9B     # Xiaomi (fine-tune of Qwen3.5-9B)
      - Granite-4.2-3B                # IBM (upgrade of Granite-4.1-3B)
      - Granite-4.2-8B                # IBM (have it; never screened)
      - Kanana-2-3B-Instruct          # Kakao
      - Jamba2-3B                     # AI21 (hybrid Mamba)
      - Apertus-v1.5-8B               # Swiss AI
      - rnj-1.5-Instruct              # Essential AI
      - Qwen3.5-9B                    # references from round 1, same session
      - Gemma-4-E4B-it
    values: [direct, step_back, self_ask]
  # Round 3 workers (2026-10-01): new lineages from the lab catalog, same saved evidence and 23
  # questions as round 2, with the same two references so the rounds line up
  strategy-screen-round3:
    name: "screen-{model}-{value}"
    description: "{model} alone, thinking with: {value} (worker answers graded directly)"
    overrides: {workers: {team: ["{model}"], strategy: "{value}", screen: true}}
    models:
      - Llama-3.1-8B-Instruct         # Meta
      - Llama-3.2-3B-Instruct         # Meta (small)
      - Command-R7B                   # Cohere (grounded answers with citations)
      - AFM-4.5B                      # Arcee AI
      - EXAONE-4.0-1.2B               # LG AI Research
      - GLM-4-9B-0414                 # Zhipu / Z.ai
      - Qwen3.5-9B                    # references, as in rounds 1 and 2
      - Gemma-4-E4B-it
    values: [direct, step_back, self_ask]
  # Coordinator bake-off, round 2: more candidates that fit on the card (run after round 1)
  coordinator-bakeoff2-swarms:
    name: "coord-{model}"
    description: "best small swarm (roles-2ways-split) with {model} as coordinator"
    overrides:
      coordinator: {model: "{model}", ctx_per_slot: 16384, parallel: 1}
      research: {split_by_subquestion: true}
      workers:
        roles:
          - {role: answerer, model: Ministral-3-3B-Instruct, strategy: self_ask}
          - {role: answerer, model: LFM2.5-2.6B, strategy: tree_of_thoughts}
          - {role: facts,    model: LFM2.5-2.6B}
          - {role: premise,  model: Ministral-3-3B-Instruct}
          - {role: skeptic,  model: Granite-4.1-3B}
    models: &bakeoff2_coords
      - MiMo-V2.6-Distill-Qwen-9B      # Xiaomi
      - HyperCLOVAX-SEED-Think-14B     # NAVER
      - Apriel-1.6-15B-Thinker         # ServiceNow
      - Phi-4-reasoning-vision-15B     # Microsoft
      - ERNIE-4.5-21B-A3B-Thinking     # Baidu, MoE, 3-bit so it fits on the card
  coordinator-bakeoff2-solos:
    name: "solo-{model}"
    description: "{model} alone reads the evidence and answers"
    overrides: {mode: solo, coordinator: {model: "{model}", ctx_per_slot: 12288, parallel: 1}}
    models: *bakeoff2_coords
  # ---- RERANKER: a model that re-orders search passages by relevance before the models read them ----
  # (FRAMES: 50-68% of answers were "couldn't find it" - choosing the right passages is the bottleneck)

# Named groups you can pass to --configs
groups:
  baseline: [swarm-mixed, coordinator-only, single-large, same-model-x3]
  team-size: [coordinator-only, swarm-t1, swarm-t2, swarm-t3, swarm-t4, swarm-t5]
  roles-study: [coordinator-only, swarm-t2, swarm-roles]
  team-diversity: [swarm-t3, team-clones, team-1model-3ways, team-3models-3ways, swarm-t2, team-2models-2ways, swarm-roles, roles-no-premise, roles-2ways, coordinator-only]
  # the long overnight study: every model in every research job, every strategy, and team variety
  # big single models vs the swarm, measured on the same evidence (+ the current swarm and the
  # coordinator alone as reference points from the same session)
  heavyweight-study: [heavyweights, bigcoord-gptoss, bigcoord-qwen36, roles-no-premise, coordinator-only, solo-x4-Qwen3.5-4B, solo-x8-Qwen3.5-4B]
  # tonight: everything that matters, LIVE (each run does its own research), fastest first
  overnight-live: [coordinator-only, team-clones, clones-split, roles-2ways, roles-2ways-split, swarm-t3,
                   solo-x4-Qwen3.5-4B, solo-x8-Qwen3.5-4B, solo-Qwen3.5-9B,
                   solo-gpt-oss-20b, solo-Qwen3-14B, solo-DeepSeek-R1-Distill-Qwen-14B, bigcoord-gptoss,
                   solo-Gemma-4-26B-A4B-it, solo-Qwen3.6-35B-A3B, bigcoord-qwen36,
                   solo-Qwen3.6-27B, solo-Gemma-4-31B-it]
  # External validity study: the configurations that did best on our own questions, FROZEN before
  # any GAIA / FRAMES result is seen (evals/frozen/external-v1.json) and run unchanged on
  # GAIA, FRAMES and the 63 post-training questions:
  #   one 4B pass | the same 4B with a swarm-sized budget (8 drafts) | 9B alone | 35B MoE alone |
  #   best small swarm (roles, 2 ways of thinking, per-part research) | same swarm with the 35B coordinating
  external-v1: [coordinator-only, solo-x8-Qwen3.5-4B, solo-Qwen3.5-9B, solo-Qwen3.6-35B-A3B,
                roles-2ways-split, bigcoord-qwen36]
  round2-screen: [strategy-screen-round2]
  round3-screen: [strategy-screen-round3]
  coordinator-bakeoff2: [coordinator-bakeoff2-swarms, coordinator-bakeoff2-solos]
  reranker-study: [coordinator-only, rerank06-coordinator-only, rerank4b-coordinator-only, roles-2ways-split, rerank4b-roles-2ways-split]
  # coordinator bake-off: current best swarm (4B coordinator) vs the same swarm with each candidate
  coordinator-bakeoff: [roles-2ways-split, coordinator-bakeoff-swarms, coordinator-bakeoff-solos]
  # tonight: the answer-worker candidates, every way of thinking (built-in thinking last: slowest)
  strategy-study: [strategy-screen, strategy-screen-native]
  big-study: [worker-tournament, solo-tournament, strategy-ministral, strategy-lfm, team-diversity]

# Run these when no --configs are given
default: [swarm-mixed, coordinator-only, single-large, same-model-x3]

# Answers slower than this are flagged in the report (research-level questions)
time_target_seconds: 90

# The judge grades every answer against the question's must / must_not list.
# Use the strongest model that fits alone on the GPU, ideally from a lineage
# that is not the coordinator's. It sees the rubric, not the evidence.
judge:
  model: Ministral-3-14B-Instruct
  ctx_per_slot: 8192
  parallel: 1
# optional cross-check (--judge2): a judge from a different family, used when the main judge's
# own model is one of the contestants (e.g. Ministral-14B as a coordinator in the bake-off)
judge2:
  model: gpt-oss-20b
  ctx_per_slot: 8192
  parallel: 1
